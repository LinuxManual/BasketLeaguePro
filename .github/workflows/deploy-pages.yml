name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create Firebase runtime configuration
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          AI_API_URL: ${{ secrets.AI_API_URL }}
        run: |
          mkdir -p _site/data
          cp 404.html index.html script.js styles.css _site/
          cp data/store.json _site/data/
          node <<'NODE'
          const fs = require("fs");
          const required = [
            ["apiKey", "FIREBASE_API_KEY"],
            ["authDomain", "FIREBASE_AUTH_DOMAIN"],
            ["projectId", "FIREBASE_PROJECT_ID"],
            ["storageBucket", "FIREBASE_STORAGE_BUCKET"],
            ["messagingSenderId", "FIREBASE_MESSAGING_SENDER_ID"],
            ["appId", "FIREBASE_APP_ID"]
          ];
          const missing = required.filter(([, envName]) => !process.env[envName]).map(([, envName]) => envName);
          if (missing.length) throw new Error(`Missing GitHub Actions secrets: ${missing.join(", ")}`);
          const config = Object.fromEntries(required.map(([key, envName]) => [key, process.env[envName]]));
          if (process.env.FIREBASE_MEASUREMENT_ID) config.measurementId = process.env.FIREBASE_MEASUREMENT_ID;
          fs.writeFileSync("_site/firebase-config.js", `globalThis.__FIREBASE_CONFIG__ = ${JSON.stringify(config)};\n`);
          if (process.env.AI_API_URL) {
            fs.writeFileSync("_site/ai-config.js", `globalThis.__AI_API_URL__ = ${JSON.stringify(process.env.AI_API_URL)};\n`);
          }
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
